
name: Build Jana Educational Android App

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-apk:
    name: Build Android Debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

     
      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'


      - name: Install Node Dependencies
        run: |
          npm install --legacy-peer-deps --no-audit --no-fund

      - name: Ensure Capacitor Dependencies
        run: |
          if ! npm ls @capacitor/core @capacitor/cli @capacitor/android --depth=0 > /dev/null 2>&1; then
            npm install @capacitor/core @capacitor/cli @capacitor/android --legacy-peer-deps --no-audit --no-fund
          fi

      - name: Build Jana Web Application
        run: |
          npm run build
          test -f dist/index.html

      - name: Initialize Capacitor if Missing
        run: |
          if [ ! -f capacitor.config.ts ] && [ ! -f capacitor.config.json ] && [ ! -f capacitor.config.js ]; then
            npx cap init "جنى التعليمي" "com.majedalturki.jana" --web-dir dist
          fi

      - name: Create Android Platform if Missing
        run: |
          if [ ! -d android ]; then
            npx cap add android
          fi

      - name: Sync Android Project
        run: |
          npx cap sync android

      - name: Grant Gradle Permission
        run: |
          chmod +x android/gradlew

      - name: Build Android APK
        working-directory: android
        run: |
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Upload Jana APK
        uses: actions/upload-artifact@v4
        with:
          name: Jana-Educational-Android-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
