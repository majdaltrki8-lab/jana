name: Build Jana Educational Android APK

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-apk:
    name: Build Android Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Node Dependencies
        run: npm install

      - name: Build Web Application (Vite)
        run: npm run build

      - name: Initialize or Sync Android Platform (Capacitor)
        run: |
          if [ ! -d "android" ]; then
            npx cap add android
          fi
          npx cap sync android

      - name: Grant Execute Permission to Gradle
        run: |
          cd android
          chmod +x gradlew

      - name: Build Android Debug APK with Gradle
        run: |
          cd android
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Prepare APK Artifacts
        run: |
          mkdir -p output-apk
          if [ -f "android/app/build/outputs/apk/debug/app-debug.apk" ]; then
            cp android/app/build/outputs/apk/debug/app-debug.apk output-apk/Jana-Educational-App-debug.apk
            cp android/app/build/outputs/apk/debug/app-debug.apk output-apk/app-debug.apk
            echo "APK generated successfully!"
          else
            echo "Searching for generated APK..."
            find android/app/build/outputs/apk -name "*.apk" -exec cp {} output-apk/ \;
          fi

      - name: Upload Android APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Jana-Educational-App-Android-APK
          path: output-apk/*.apk
          retention-days: 30
